<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Cactu v3 phones</title>
<!-- The chosen favicon (project/brand/smooth): PNG only, so the 16 px tab gets the version drawn on the 16 grid -->
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="favicon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=block">
<style>
  * { box-sizing:border-box; margin:0 }

  body {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 56px;
    padding: 40px;
    background: #e3dccb;
    color: #23211c;
    font: 15px / 1.4 "Atkinson Hyperlegible", sans-serif;
  }

  figure { display:flex; flex-direction:column; gap:14px; width:390px }
  figcaption b { display:block; font:800 18px "Bricolage Grotesque" }
  figcaption span { color:#6b6559 }

  iframe, img {
    width: 390px;
    height: 844px;
    border: 0;
    border-radius: 44px;
    outline: 10px solid #23211c;
  }
</style>
</head>
<body>
  <!-- Version 3 on three phones (390 × 844), live; ?static shows the screenshots made by tools/shoot.sh instead -->
  <figure>
    <iframe src="index.html" data-shot="v3-phone"></iframe>
    <figcaption><b>Start</b><span>Logo nad światem, pasek postaci na dole świata, strony w pasku na dole ekranu</span></figcaption>
  </figure>
  <figure>
    <iframe src="index.html?character=ranfisz" data-shot="v3-phone-ranfisz"></iframe>
    <figcaption><b>Inna postać</b><span>Wybrana postać jest pierwsza na pasku, a świat i kolory strony są jej</span></figcaption>
  </figure>
  <figure>
    <iframe src="../tools/frame.html?page=v3/index.html&scroll=400&width=390&height=844" data-shot="v3-phone-scrolled"></iframe>
    <figcaption><b>Po przewinięciu</b><span>Świat odjeżdża w górę, pasek ze stronami zostaje na dole</span></figcaption>
  </figure>

<script>
  if (new URLSearchParams( location.search ).has( `static` )) for (const frame of document.querySelectorAll( `iframe` )) {
    const image = document.createElement( `img` )

    image.src = `../screenshots/${frame.dataset.shot}.png`
    frame.replaceWith( image )
  }
</script>
</body>
</html>
